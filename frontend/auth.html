<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Form</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>
  <body>
    <div>
      <div class="hero">
        <div class="hero-logo">
          <a href="index.html"
            ><img src="./images/clann-zu-logo.png" alt="clann zu"
          /></a>
        </div>
        <div class="hero-title">Clann Zú fan-site</div>

        <div class="hero-auth"></div>
      </div>
      <ul class="navbar-nav"></ul>
    </div>
    <section id="auth-container">
      <div class="login-form">
        <div class="auth-title">Log in to your account</div>
        <form class="loggin-form">
          <input
            class="email-input"
            placeholder="email or nickname"
            type="text"
          />
          <input
            class="password-input"
            placeholder="password"
            type="password"
          />
          <button class="submit-btn" type="submit">Log in</button>
        </form>
      </div>
      <div class="register-form">
        <div class="auth-title">Registration</div>
        <form class="register-form">
          <input class="email-input" placeholder="email" type="email" />
          <input class="nickname-input" placeholder="nickname" type="text" />
          <input
            class="password-input"
            placeholder="password"
            type="password"
          />
          <button class="submit-btn" type="submit">Sign Up</button>
        </form>
      </div>
    </section>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/navbar.js"></script>
  </body>
</html>
