<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Form</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>
  <body>
    <div class="hero">
      <div class="hero-logo">
        <a href="index.html"
          ><img src="./images/claa-zu-logo.png" alt="clann zu"
        /></a>
      </div>
      <div class="hero-title">Clann Zú fan-site</div>

      <div class="hero-auth">
        <button class="hero-btn toggle-btn active" data-form="login">
          Sign In
        </button>
        <button class="hero-btn toggle-btn" data-form="register">
          Sign Up
        </button>
      </div>
    </div>
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="index.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="./albums.html">Albums</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="./posts.html">Blog</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="./about.html">About</a>
      </li>
    </ul>
    <div class="auth-container login-form active">
      <p>Log in to your account</p>
      <form class="loggin-form">
        <input
          class="email-input"
          placeholder="email or nickname"
          type="text"
        />
        <input class="password-input" placeholder="password" type="password" />
        <button class="submit-btn" type="submit">Log in</button>
      </form>
    </div>

    <div class="auth-container register-form">
      <p>Registration</p>
      <form class="register-form">
        <input placeholder="email" type="email" />
        <input placeholder="nickname" type="text" />
        <input placeholder="password" type="password" />
        <button type="submit">Sign Up</button>
      </form>
    </div>
    <script type="module" src="./js/auth.js"></script>
    <script src="./js/navbar.js"></script>
  </body>
</html>
